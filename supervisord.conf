; Supervisor: roda opencode web (4096) e code-server (8080) no mesmo container.
; Executado como o usuário não-root UID 1000; os programas herdam esse usuário.
; Roda em foreground (-n) para ser o PID 1 (via entrypoint + exec).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:opencode]
command=/usr/local/bin/opencode web --hostname 0.0.0.0 --port 4096
directory=/home/opencode/agenteresolve
environment=HOME="/home/opencode"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:codeserver]
command=/usr/bin/code-server --bind-addr 0.0.0.0:8080 --auth password --disable-telemetry --disable-update-check
directory=/home/opencode/agenteresolve
environment=HOME="/home/opencode",PASSWORD="%(ENV_OPENCODE_SERVER_PASSWORD)s"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
