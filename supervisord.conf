; Supervisor: roda Caddy (proxy interno :8080), opencode web (:4096) e
; code-server (:8081) no mesmo container. Executado como UID 1000; os programas
; herdam esse usuário. Roda em foreground (-n) como PID 1 (via entrypoint + exec).
;
; Só o Caddy (8080) é exposto ao Traefik; opencode/code-server ficam em loopback.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:caddy]
command=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
directory=/home/opencode/agenteresolve
environment=HOME="/home/opencode"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:opencode]
command=/usr/local/bin/opencode web --hostname 127.0.0.1 --port 4096
directory=/home/opencode/agenteresolve
environment=HOME="/home/opencode"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:codeserver]
command=/usr/bin/code-server --bind-addr 127.0.0.1:8081 --auth password --disable-telemetry --disable-update-check
directory=/home/opencode/agenteresolve
environment=HOME="/home/opencode",PASSWORD="%(ENV_OPENCODE_SERVER_PASSWORD)s"
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
